spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/golf?sslmode=prefer}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:hubilon1!}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always                                # dev에서만 schema.sql 실행
      schema-locations: classpath:schema.sql      # src/main/resources/schema.sql
      continue-on-error: false
  jpa:
    hibernate:
      ddl-auto: validate
logging:
  level:
    com.golf.erp: info
    org.hibernate.SQL: info