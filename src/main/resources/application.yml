server:
  port: 8040

spring:
  application:
    name: golf-be-erp
  profiles:
    default: dev
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # 모든 테이블은 golf 스키마 (MyBatis SQL 은 golf. 을 직접 붙인다)
        default_schema: golf
  sql:
    init:
      mode: never
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.golf.erp: info
