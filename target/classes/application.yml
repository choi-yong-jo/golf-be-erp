server:
  port: 8081

spring:
  application:
    name: golf-be-erp
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      # 스키마는 db/golf-erp-db.sql 이 만든다. 엔티티와 테이블이 어긋나면 기동 실패
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        # 모든 테이블은 golf 스키마
        default_schema: golf
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  jackson:
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

erp:
  jwt:
    # HS256 서명 키(32바이트 이상). 운영은 반드시 환경변수로 지정
    secret: ${JWT_SECRET:}
    issuer: golf-be-erp
    access-token-ttl: ${JWT_ACCESS_TTL:PT2H}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P14D}
  bootstrap:
    # admin_user 가 하나도 없을 때만 만든다. 비밀번호를 비우면 임의 값을 만들어 로그에 한 번 출력
    admin-username: ${ERP_ADMIN_USERNAME:admin}
    admin-password: ${ERP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  file:
    # 업로드 파일 저장 디렉터리(LOCAL). 운영은 공유 볼륨 경로로 지정
    storage-dir: ${FILE_STORAGE_DIR:./uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.golf.erp: info
