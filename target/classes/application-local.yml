# 로컬 PostgreSQL. schema.sql(PostgreSQL 전용: 부분 인덱스, JSONB)은 H2에서 실행할 수 없어 H2는 쓰지 않는다.
# 스키마는 dev 프로필 또는 psql 로 미리 만들어 둔다: psql -1 -d golf -f src/main/resources/db/schema.sql
spring:
  datasource:
    url: "jdbc:h2:mem:golf;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    username: sa
    password: ""
  sql:
    init:
      mode: never
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      "[jakarta.persistence.create-database-schemas]": true

logging:
  level:
    com.golf.erp: debug
    org.hibernate.SQL: debug
