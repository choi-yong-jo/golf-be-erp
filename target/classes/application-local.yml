# 로컬 PostgreSQL, 스키마 스크립트는 실행하지 않는다(미리 만들어 둔 DB 사용).
#   psql -1 -h localhost -U postgres -d golf -f src/main/resources/db/golf-erp-db.sql
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/golf}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

erp:
  jwt:
    secret: ${JWT_SECRET:dev-only-golf-erp-jwt-secret-key-change-me-0123456789}

logging:
  level:
    com.golf.erp: debug
    org.hibernate.SQL: debug
